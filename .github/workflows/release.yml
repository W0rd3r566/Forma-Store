name: Signed release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'scripts/verify-release.py']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.FORMA_KEYSTORE_BASE64 }}
      FORMA_STORE_PASSWORD: ${{ secrets.FORMA_STORE_PASSWORD }}
      FORMA_KEY_ALIAS: ${{ secrets.FORMA_KEY_ALIAS }}
      FORMA_KEY_PASSWORD: ${{ secrets.FORMA_KEY_PASSWORD }}
      FORMA_KEYSTORE_PATH: ${{ github.workspace }}/forma-release.jks
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Load signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing FORMA_KEYSTORE_BASE64'; exit 1; }
          test -n "$FORMA_STORE_PASSWORD" && test -n "$FORMA_KEY_ALIAS" && test -n "$FORMA_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$FORMA_KEYSTORE_PATH"
          chmod 600 "$FORMA_KEYSTORE_PATH"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and validate
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease
      - name: Fetch previous published APK
        run: |
          mkdir -p previous-release
          gh release download v0.1.0 --pattern forma-store.apk --dir previous-release
      - name: Verify APK, package version and signing continuity
        id: apk
        run: python3 scripts/verify-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: forma-store-signed
          path: |
            forma-store.apk
            forma-store.apk.sha256
      - name: Publish stable release
        env:
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Existing version will not be overwritten.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" forma-store.apk forma-store.apk.sha256 --target "$GITHUB_SHA" --title "Forma Store $RELEASE_TAG" --notes-file docs/RELEASE-0.2.0.md
      - name: Upload non-secret verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            verification-report.txt
            app/build/reports/
          if-no-files-found: ignore
      - name: Clean signing key
        if: always()
        run: rm -f "$FORMA_KEYSTORE_PATH"
