name: Signed release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.FORMA_KEYSTORE_BASE64 }}
      FORMA_STORE_PASSWORD: ${{ secrets.FORMA_STORE_PASSWORD }}
      FORMA_KEY_ALIAS: ${{ secrets.FORMA_KEY_ALIAS }}
      FORMA_KEY_PASSWORD: ${{ secrets.FORMA_KEY_PASSWORD }}
      FORMA_KEYSTORE_PATH: ${{ github.workspace }}/forma-release.jks
    steps:
      - uses: actions/checkout@v4
      - name: Load signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing FORMA_KEYSTORE_BASE64'; exit 1; }
          test -n "$FORMA_STORE_PASSWORD" && test -n "$FORMA_KEY_ALIAS" && test -n "$FORMA_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$FORMA_KEYSTORE_PATH"
          chmod 600 "$FORMA_KEYSTORE_PATH"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and validate
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease
      - name: Verify signed APK and previous release identity
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          VERSION=$("$TOOLS/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test -n "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF#refs/tags/}" = "v$VERSION"; fi
          if gh release view >/dev/null 2>&1; then
            mkdir previous-release
            gh release download --pattern forma-store.apk --dir previous-release
            "$TOOLS/apksigner" verify previous-release/forma-store.apk
            OLD=$("$TOOLS/apksigner" verify --print-certs previous-release/forma-store.apk | grep 'Signer #1 certificate SHA-256 digest:')
            NEW=$("$TOOLS/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:')
            test "$OLD" = "$NEW" || { echo 'Signing certificate changed; publication blocked'; exit 1; }
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cp "$APK" forma-store.apk
          sha256sum forma-store.apk > forma-store.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: forma-store-signed
          path: |
            forma-store.apk
            forma-store.apk.sha256
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Existing version will not be overwritten.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" forma-store.apk forma-store.apk.sha256 --target "$GITHUB_SHA" --title "Forma Store $RELEASE_TAG" --notes 'Pinned search and search history; app screenshot gallery and release notes where F-Droid provides them; expandable descriptions; Open and Share; version comparison and download-all; persistent download queue with foreground transfer notification; install outcome reconciliation; light/dark/system themes, wallpaper colors, reduced dock motion; JSON settings backup. Android may terminate transfers: interrupted APK downloads restart from zero. Install reconciliation cannot distinguish user cancellation from every system rejection. Media metadata currently re-reads the verified index on opening a detail page, which may take time. Same certificate as the prior release is checked in CI.'
      - name: Clean signing key
        if: always()
        run: rm -f "$FORMA_KEYSTORE_PATH"
